<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>LiftLog</title>
<meta name="theme-color" content="#0d0f12" />
<meta name="description" content="Local-first strength training logbook" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LiftLog" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app">

  <header class="topbar" id="topbar"></header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <div class="tab-pill" aria-hidden="true"></div>
    <button class="tab-btn" data-tab="log" aria-label="Log">
      <svg viewBox="0 0 24 24"><path d="M6.5 7h11M6.5 12h7M6.5 17h9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span>Log</span>
    </button>
    <button class="tab-btn" data-tab="history" aria-label="History">
      <svg viewBox="0 0 24 24"><path d="M4 4v6h6M4.5 10a8 8 0 1 1 2 5.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>History</span>
    </button>
    <button class="tab-btn" data-tab="progress" aria-label="Progress">
      <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 16l3.5-4 3 2.5L20 8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Progress</span>
    </button>
    <button class="tab-btn" data-tab="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Settings</span>
    </button>
  </nav>
</div>

<div id="modal-root"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
